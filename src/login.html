<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page — LMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {
              50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1',
              400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155',
              800: '#1e293b', 900: '#0f172a', 950: '#020617'
            },
            amber: {
              500: '#f59e0b', 600: '#d97706', 700: '#b45309'
            },
            terracotta: {
              500: '#c2704e', 600: '#a85d3f'
            }
          },
          borderRadius: {
            'lg': '8px'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .bg-grid-pattern {
      background-image:
        linear-gradient(to right, rgb(148 163 184 / 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgb(148 163 184 / 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <div class="absolute inset-0 bg-gradient-to-br from-slate-100 via-slate-50 to-slate-100"></div>
  <div class="absolute inset-0 bg-grid-pattern"></div>
  <div class="relative w-full max-w-sm mx-4">
    <div class="bg-white rounded-lg shadow-lg border border-slate-200 px-8 py-10">
      <h1 class="text-2xl font-semibold text-slate-800 text-center mb-8">Sign In</h1>
      <form onsubmit="event.preventDefault();">
        <div class="mb-5">
          <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" />
        </div>
        <div class="mb-7">
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" />
        </div>
        <button type="submit" class="w-full bg-amber-600 text-white font-medium py-2.5 px-4 rounded-lg text-sm hover:bg-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 transition active:scale-[0.98]">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
