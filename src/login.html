<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="bg-white rounded-lg shadow-md px-8 py-10">
      <h1 class="text-2xl font-semibold text-gray-800 text-center mb-8">Sign In</h1>
      <form action="#" method="POST">
        <div class="mb-5">
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            class="w-full px-3.5 py-2.5 border border-gray-300 rounded-md text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
          />
        </div>
        <div class="mb-7">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            class="w-full px-3.5 py-2.5 border border-gray-300 rounded-md text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 text-white font-medium py-2.5 px-4 rounded-md text-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition"
        >
          Sign In
        </button>
      </form>
    </div>
  </div>
</body>
</html>
